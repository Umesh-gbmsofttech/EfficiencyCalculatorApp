name: Android APK Build

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_COMPANY_LATITUDE: ${{ secrets.EXPO_PUBLIC_COMPANY_LATITUDE }}
      EXPO_PUBLIC_COMPANY_LONGITUDE: ${{ secrets.EXPO_PUBLIC_COMPANY_LONGITUDE }}
      EXPO_PUBLIC_COMPANY_RADIUS_METERS: ${{ secrets.EXPO_PUBLIC_COMPANY_RADIUS_METERS }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Validate Required Secrets
        run: |
          required=(
            EXPO_PUBLIC_FIREBASE_API_KEY
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
            EXPO_PUBLIC_FIREBASE_PROJECT_ID
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            EXPO_PUBLIC_FIREBASE_APP_ID
            EXPO_PUBLIC_COMPANY_LATITUDE
            EXPO_PUBLIC_COMPANY_LONGITUDE
            EXPO_PUBLIC_COMPANY_RADIUS_METERS
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            GOOGLE_SERVICES_JSON_BASE64
          )
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret/env: $key"
              exit 1
            fi
          done

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-upload-key.keystore

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

      - name: Remove Existing Android Folder
        run: rm -rf android

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify Expo Modules Wiring
        run: |
          test -f android/settings.gradle || (echo "android/settings.gradle missing" && exit 1)
          cat android/settings.gradle
          grep -q "useExpoModules()" android/settings.gradle || (echo "useExpoModules() missing from settings.gradle" && exit 1)

      - name: Patch settings.gradle for expo-modules-core (CI safeguard)
        run: |
          SETTINGS_FILE="android/settings.gradle"
          MODULE_DIR=$(node -e "try { const p=require.resolve('expo-modules-core/package.json'); const path=require('path'); console.log(path.join(path.dirname(p),'android')); } catch(e){ console.log(''); }")
          if [ -n "$MODULE_DIR" ] && [ -d "$MODULE_DIR" ] && ! grep -q "include ':expo-modules-core'" "$SETTINGS_FILE"; then
            echo "include ':expo-modules-core'" >> "$SETTINGS_FILE"
            echo "project(':expo-modules-core').projectDir = new File(rootProject.projectDir, '../node_modules/expo-modules-core/android')" >> "$SETTINGS_FILE"
          else
            echo "expo-modules-core folder not directly resolvable; skipping manual include patch."
          fi
          echo "----- settings.gradle (final) -----"
          cat "$SETTINGS_FILE"

      - name: Place Keystore
        run: mv android-upload-key.keystore android/app/keystore.jks

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Normalize APK Filename
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found in $APK_DIR"
            exit 1
          fi
          cp "$APK_PATH" "$APK_DIR/efficiency-calc.apk"
          ls -lh "$APK_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/efficiency-calc.apk
